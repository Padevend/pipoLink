name: Synchronise le secret d'environnement AWS

on:
  workflow_dispatch:
    inputs:
      secret_id:
        description: Nom ou ARN du secret (laisser vide pour utiliser la variable GitHub AWS_APPLICATION_SECRET_ID)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    name: Synchronise Secrets Manager
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      SECRET_ID: ${{ inputs.secret_id || vars.AWS_APPLICATION_SECRET_ID }}
      APPLICATION_ENV_JSON: ${{ secrets.APPLICATION_ENV_JSON }}
    steps:
      - name: Validate GitHub configuration
        run: |
          test -n "$AWS_REGION"
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$SECRET_ID"
          test -n "$APPLICATION_ENV_JSON"

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: pipolink-secret-sync
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate and publish the JSON secret
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APPLICATION_ENV_JSON" > secret.json
          jq -e 'type == "object" and (keys | length > 0)' secret.json >/dev/null
          if aws secretsmanager describe-secret --secret-id "$SECRET_ID" >/dev/null 2>&1; then
            aws secretsmanager update-secret --secret-id "$SECRET_ID" --secret-string file://secret.json >/dev/null
          else
            aws secretsmanager create-secret --name "$SECRET_ID" --secret-string file://secret.json >/dev/null
          fi
          rm -f secret.json
