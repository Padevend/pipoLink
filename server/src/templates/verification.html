<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Reset styles */
    body, table, td, a { text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    
    body {
      margin: 0;
      padding: 0;
      width: 100% !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #0f172a;
    }

    .wrapper {
      width: 100%;
      table-layout: fixed;
      background-color: #ffffff;
      padding: 40px 0;
    }

    .main-content {
      max-width: 540px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 32px;
      border: 1px solid #f1f5f9;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.03);
      overflow: hidden;
    }

    .header {
      padding: 50px 40px 30px;
      text-align: center;
    }

    .logo-container {
      display: inline-block;
      margin-bottom: 10px;
    }

    .logo-img {
      width: 64px;
      height: 64px;
      border-radius: 16px;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 700;
      color: #ea580c;
      letter-spacing: -0.5px;
      margin: 12px 0 0;
    }

    .content-body {
      padding: 0 50px 40px;
      text-align: center;
    }

    h2 {
      font-size: 24px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: #64748b;
      margin-bottom: 24px;
    }

    /* Bloc OTP Ultra-Minimaliste Glass */
    .otp-container {
      margin: 40px 0;
      padding: 40px;
      background: rgba(255, 247, 237, 0.5);
      border-radius: 24px;
      border: 1px solid rgba(251, 146, 60, 0.1);
      position: relative;
    }

    .otp-code {
      font-family: 'SF Mono', SFMono-Regular, ui-monospace, 'Courier New', monospace;
      font-size: 48px;
      font-weight: 700;
      color: #ea580c;
      letter-spacing: 16px;
      margin: 0;
      padding-left: 16px; /* Pour centrer le texte avec letter-spacing */
    }

    .timer-badge {
      display: inline-block;
      margin-top: 15px;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .divider {
      height: 1px;
      background: radial-gradient(circle, #e2e8f0 0%, transparent 100%);
      margin: 30px 0;
    }

    .footer {
      text-align: center;
      padding-bottom: 40px;
    }

    .footer-text {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }

    @media screen and (max-width: 600px) {
      .main-content { border-radius: 0; border: none; box-shadow: none; }
      .content-body { padding: 0 25px 30px; }
      .otp-code { font-size: 36px; letter-spacing: 10px; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="main-content">
      <div class="header">
        <div class="logo-container">
          <img src="https://ik.imagekit.io/lnjhwnjj6s/file.enc" alt="Logo PipoLink" class="logo-img">
          <h1 class="brand-name">PipoLink</h1>
        </div>
      </div>

      <div class="content-body">
        <h2>Vérifiez votre identité</h2>
        <p>Bonjour {{username}},<br>Utilisez le code ci-dessous pour sécuriser l'accès à votre compte.</p>
        
        <div class="otp-container">
          <div class="otp-code">{{otp}}</div>
          <span class="timer-badge">Expire dans 15 minutes</span>
        </div>

        <p style="font-size: 13px; margin-bottom: 0;">
          L'équipe <strong>PipoLink</strong>
        </p>
        
        <div class="divider"></div>
        
        <p style="font-size: 12px; color: #cbd5e1; margin-bottom: 0;">
          Si vous n'avez pas sollicité ce code, ignorez simplement cet e-mail.
        </p>
      </div>
    </div>

    <div class="footer">
      <p class="footer-text">
        &copy; 2026 PipoLink. Tous droits réservés.<br>
      </p>
    </div>
  </div>
</body>
</html>
