services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: pipolink-backend
    container_name: pipolink-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "2654:2654"
    volumes:
      - ./server/storage:/app/storage
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: pipolink-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
