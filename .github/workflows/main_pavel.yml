# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - pavel

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: pnpm install and build
        run: |
          pnpm install --frozen-lockfile --config.node-linker=hoisted
          pnpm build

      # --ignore-scripts : sans cette option, pnpm relance le postinstall du projet
      # (prisma generate) alors que prisma, une devDependency, vient d'être supprimé.
      - name: Prune dev dependencies
        run: pnpm prune --prod --ignore-scripts --config.node-linker=hoisted

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # 'working-directory' ne s'applique pas à 'path' : sans "server",
          # c'est toute la racine du dépôt qui serait déployée.
          path: server

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_96F1CC5719EC45E98FC34D713C87BD55 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_300776D29F044066BE236A5BD0348372 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B8B571BF1B3A4ED8B0FB765E450A5C0B }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pavel'
          slot-name: 'Production'
          package: .
